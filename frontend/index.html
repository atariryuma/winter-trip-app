<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <!-- Tints the opaque iOS status bar; useTheme() keeps it in sync with light/dark -->
  <meta name="theme-color" content="#f1f5f9">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!--
    Keep "default" (do not switch to "black-translucent").
    With black-translucent the page runs under the status bar, and since iOS 26
    the Home Screen app lays its Liquid Glass edge blur over the top of the page
    (there is no CSS/meta opt-out). With "default" the web view starts below an
    opaque status bar, so nothing is blurred. iOS reads this tag only when the
    app is added to the Home Screen, so existing installs must be re-added.
  -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TripPlanner">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <meta name="description" content="家族の旅のしおり - 予定・予約・持ち物・お金をみんなで共有">
  <meta property="og:title" content="TripPlanner">
  <meta property="og:description" content="家族の旅のしおり - 予定・予約・持ち物・お金をみんなで共有">
  <meta property="og:type" content="website">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap"
    rel="stylesheet">

  <!-- Apply the saved theme before first paint to avoid a light/dark flash -->
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('theme') || 'null') || (localStorage.getItem('darkMode') === 'true' ? 'dark' : 'system');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { }
    })();
  </script>
  <title>TripPlanner</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (err) {
          console.warn('SW registration failed:', err);
        });
      });
    }
  </script>
</body>

</html>
